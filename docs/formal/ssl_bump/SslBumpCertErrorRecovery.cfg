\* Test cert error recovery path WITHOUT validation error.
\* When a non-validation negotiation error occurs and server cert exists,
\* Squid re-runs the ACL. This path can result in splice if the ACL
\* or mode fallback says splice (peek mode defaults to splice).
\* EXPECTED: NoUnintendedSplice may be violated if peek + certError
\*           + no validation error → ACL re-runs → mode-based fallback → splice

CONSTANTS
  Step1AclOutcome = 3
  Step2AclOutcome = 3
  Step3AclOutcome = 5
  ServerBehavior = "certError"
  HasValidationError = FALSE

SPECIFICATION Spec

INVARIANTS
  TypeInvariant
  DoneImpliesResolved
  CertErrorNeverSplices
  BypassOnlyOnHardcodedPath

PROPERTY
  EventuallyResolves
