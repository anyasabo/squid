# Squid config for smuggling tests: relaxed_header_parser ON (default)
http_port 3128

# Relaxed parsing -- default production behavior
relaxed_header_parser on

# Minimal ACLs for testing
acl localnet src all
acl CONNECT method CONNECT

http_access deny CONNECT
http_access allow localnet
http_access deny all

# Disable caching
cache deny all

# Forward to backends without modification
via off
forwarded_for delete

# Disable logging (tests inspect responses, not logs)
access_log none
cache_log /dev/null

# Pipeline settings
pipeline_prefetch 1
