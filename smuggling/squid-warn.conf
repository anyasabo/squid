# Squid config for smuggling tests: relaxed_header_parser WARN
http_port 3128

# Warn mode -- accepts like relaxed but logs warnings
relaxed_header_parser warn

acl localnet src all
acl CONNECT method CONNECT

http_access deny CONNECT
http_access allow localnet
http_access deny all

cache deny all
via off
forwarded_for delete
access_log none
cache_log /dev/null
pipeline_prefetch 1
