# Squid config for smuggling tests: relaxed_header_parser OFF (strict)
http_port 3128

# Strict parsing -- rejects ambiguous constructs
relaxed_header_parser off

acl localnet src all
acl CONNECT method CONNECT

http_access deny CONNECT
http_access allow localnet
http_access deny all

cache deny all
via off
forwarded_for delete
access_log none
cache_log /dev/null
pipeline_prefetch 1
