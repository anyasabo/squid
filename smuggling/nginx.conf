worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;

    # Return a JSON body describing what nginx parsed from the request
    # $request_body requires reading the body via proxy_pass or similar;
    # for simplicity we use a Lua content handler.
    # If lua is unavailable, fall back to a simple echo via return.

    server {
        listen 8890;
        server_name _;

        # Use a small client body buffer so $request_body is populated
        client_body_buffer_size 1m;
        client_max_body_size 1m;

        location / {
            # Mirror the request interpretation as nginx sees it
            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data() or ""
                local headers = ngx.req.get_headers(0, true)
                local cjson = require "cjson"

                local resp = {
                    method = ngx.req.get_method(),
                    uri = ngx.var.request_uri,
                    http_version = ngx.req.http_version(),
                    headers = headers,
                    body = body,
                    body_len = #body,
                    content_length = ngx.var.content_length,
                    transfer_encoding = ngx.var.http_transfer_encoding,
                }

                ngx.header["Content-Type"] = "application/json"
                ngx.header["Connection"] = "close"
                ngx.say(cjson.encode(resp))
            }
        }
    }
}
